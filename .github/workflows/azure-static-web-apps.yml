name: Validate and deploy Kamishibai manually
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: kamishibai-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc
          python -m pip install -r api/requirements.txt
      - name: Tests
        run: |
          python -m unittest discover -s api/tests -v
          node --test frontend/tests/ui.test.cjs
          git diff --check
      - name: Stage explicit publish files
        run: python scripts/prepare_deployment.py
      - name: Deploy managed API and static frontend
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: .swa-publish/frontend
          api_location: .swa-publish/api
          output_location: ''
          skip_app_build: true
