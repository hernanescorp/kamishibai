<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mi Kamishibai</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; color: #20392f; background: #f2f5f1; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 32px 16px; }
    main { max-width: 700px; margin: auto; }
    h1 { margin-bottom: 8px; font-size: 2rem; }
    #fecha { color: #506357; }
    .panel { background: white; padding: 20px; border-radius: 16px; margin-top: 24px; box-shadow: 0 4px 24px #20392f09; }
    progress { width: 100%; height: 12px; accent-color: #28704a; }
    #progreso { margin-top: 0; }
    ul { list-style: none; padding: 0; margin: 12px 0 0; }
    li + li { border-top: 1px solid #e8eee8; }
    label { display: flex; align-items: center; gap: 16px; min-height: 72px; padding: 12px 0; cursor: pointer; }
    time { font-variant-numeric: tabular-nums; font-weight: 650; }
    .detalle { flex: 1; }
    small { display: block; color: #657369; margin-top: 3px; }
    input { width: 22px; height: 22px; accent-color: #28704a; flex-shrink: 0; }
    li.completa .nombre { color: #657369; text-decoration: line-through; }
    button { padding: 10px 18px; border: 0; border-radius: 8px; background: #286344; color: white; font: inherit; cursor: pointer; }
    #estado { line-height: 1.5; }
    #estado.error { color: #a12d26; }
    [hidden] { display: none !important; }
    @media (max-width: 400px) { .panel { padding: 14px; } label { gap: 10px; } }
  </style>
</head>
<body>
<main>
  <h1>Mi Kamishibai</h1>
  <p><a href="/.auth/logout?post_logout_redirect_uri=/login.html">Cerrar sesión</a></p>
  <p id="fecha"></p>
  <p id="estado" role="status" aria-live="polite"></p>
  <button id="reintentar" type="button" hidden>Reintentar</button>
  <section class="panel" aria-label="Tareas del día" aria-busy="true">
    <p id="progreso" aria-live="polite">0 / 13 tareas completadas</p>
    <progress id="barra" value="0" max="13" aria-label="Progreso diario"></progress>
    <ul id="tareas"></ul>
  </section>
</main>
<script>
'use strict';
const $ = id => document.getElementById(id);
const dayFormatter = new Intl.DateTimeFormat('en-CA', {timeZone: 'Europe/Madrid', year:'numeric', month:'2-digit', day:'2-digit'});
function madridDay() {
  const parts = Object.fromEntries(dayFormatter.formatToParts(new Date()).map(p => [p.type, p.value]));
  return `${parts.year}-${parts.month}-${parts.day}`;
}
let tasks = [], loadedDay = null, loading = false, pending = 0, retryAction = null;
function status(message = '', error = false, retry = null) {
  $('estado').textContent = message;
  $('estado').classList.toggle('error', error);
  retryAction = retry;
  $('reintentar').hidden = !retry;
}
const RETRY_DELAYS = [5000, 10000, 15000];
const GLOBAL_TIMEOUT = 90000;
const REQUEST_TIMEOUT = 25000;
const wait = milliseconds => new Promise(resolve => setTimeout(resolve, milliseconds));
async function request(url, options, deadline = Date.now() + GLOBAL_TIMEOUT, writeDay = null) {
  for (let attempt = 0; ; attempt++) {
    if (Date.now() >= deadline) throw new Error('Se ha agotado el tiempo de conexión. Pulsa Reintentar.');
    // Never repeat an old day's write after midnight.
    if (writeDay && writeDay !== madridDay()) throw new Error('Ha cambiado el día. Actualizando las tareas.');
    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), Math.min(REQUEST_TIMEOUT, deadline - Date.now()));
    let data, response;
    try {
      response = await fetch(url, {...options, signal: controller.signal, cache: 'no-store'});
      if (response.status === 401 || response.status === 403) {
        window.location.assign(response.status === 401 ? '/login.html' : '/acceso-denegado.html');
        const error = new Error('Tu sesión no permite continuar.'); error.auth = true; throw error;
      }
      data = await response.json();
    } catch (error) {
      if (error.auth) throw error;
      throw new Error(error.name === 'AbortError' ? 'La respuesta ha tardado demasiado.' : 'No se pudo confirmar la respuesta del servidor.');
    } finally { clearTimeout(timeout); }
    if (response.ok) return data;
    if (response.status !== 503 || data.transitorio !== true) throw new Error(data.error || 'No se pudo completar la operación.');
    const delay = RETRY_DELAYS[attempt];
    if (delay === undefined || Date.now() + delay >= deadline) throw new Error('La base de datos sigue sin estar disponible. Pulsa Reintentar.');
    status(`Conectando con la base de datos... Nuevo intento en ${delay / 1000} segundos.`);
    await wait(delay);
  }
}

function progress() {
  const count = tasks.filter(t => t.completado).length;
  $('progreso').textContent = `${count} / 13 tareas completadas`;
  $('barra').value = count;
}
function render() {
  $('fecha').textContent = new Intl.DateTimeFormat('es-ES', {dateStyle:'full', timeZone:'Europe/Madrid'}).format(new Date(`${loadedDay}T12:00:00Z`));
  $('tareas').replaceChildren();
  for (const task of tasks) {
    const li = document.createElement('li');
    li.classList.toggle('completa', task.completado);
    const label = document.createElement('label');
    const hour = document.createElement('time'); hour.textContent = task.hora;
    const detail = document.createElement('span'); detail.className = 'detalle';
    const name = document.createElement('span'); name.className = 'nombre'; name.textContent = task.nombre;
    const duration = document.createElement('small');
    const minutes = task.duracion_minutos;
    duration.textContent = minutes == null ? '—' : minutes % 60 === 0 ? `${minutes / 60} h` : `${minutes} min`;
    detail.append(name, duration);
    const checkbox = document.createElement('input'); checkbox.type = 'checkbox'; checkbox.checked = task.completado;
    checkbox.addEventListener('change', () => save(task, checkbox, li));
    label.append(hour, detail, checkbox); li.append(label); $('tareas').append(li);
  }
  progress();
}
async function load(deadline = Date.now() + GLOBAL_TIMEOUT) {
  if (loading || pending) return;
  loading = true;
  $('tareas').querySelectorAll('input').forEach(input => input.disabled = true);
  document.querySelector('section').setAttribute('aria-busy', 'true');
  status('Conectando con la base de datos...');
  try {
    const data = await request('/api/tareas', undefined, deadline);
    tasks = data.tareas; loadedDay = data.fecha; render(); status(); return true;
  } catch (error) { status(error.message, true, () => load()); return false; }
  finally { loading = false; document.querySelector('section').setAttribute('aria-busy', 'false'); }
}
async function save(task, checkbox, li) {
  if (pending || loading) { checkbox.checked = task.completado; return; }
  const desired = checkbox.checked;
  const day = loadedDay;
  const deadline = Date.now() + GLOBAL_TIMEOUT;
  checkbox.checked = task.completado; pending++;
  $('tareas').querySelectorAll('input').forEach(input => input.disabled = true);
  let reconcile = false;
  status('Guardando en la base de datos...');
  try {
    // Reserve 15 seconds to reconcile a response that could have been lost.
    const data = await request('/api/check', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({id_tarea:task.id_tarea, completado:desired})}, deadline - 15000, day);
    if (data.fecha !== loadedDay) { loadedDay = null; reconcile = true; }
    else { task.completado = data.completado; checkbox.checked = data.completado; li.classList.toggle('completa', data.completado); progress(); }
    status();
  } catch (error) {
    if (!error.auth) {
      reconcile = true;
      status('No se pudo confirmar el cambio. Consultando el estado guardado...');
    } else { status(error.message, true); }
  } finally {
    pending--;
    if (reconcile || loadedDay !== madridDay()) {
      // GET is safe even if POST committed before its response disappeared.
      const recovered = await load(deadline);
      if (!recovered) status('No se pudo confirmar el cambio ni recuperar el estado guardado. Pulsa Reintentar antes de modificar más tareas.', true, () => load());
      else if (loadedDay === day && tasks.find(item => item.id_tarea === task.id_tarea)?.completado !== desired) {
        status('El cambio no quedó guardado. Se ha recuperado el estado del servidor.', true);
      }
    } else { $('tareas').querySelectorAll('input').forEach(input => input.disabled = false); }
  }
}

$('reintentar').addEventListener('click', () => retryAction?.());
setInterval(() => { if (loadedDay && loadedDay !== madridDay()) load(); }, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && loadedDay !== madridDay()) load(); });
load();
</script>
</body>
</html>
